<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1017"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>GymCoach</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f2f5fa;background:#0d1017;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:22px 16px 105px}h1{font-size:30px;margin:5px 0}h2{font-size:20px;margin:22px 0 12px}h3{margin:0 0 8px;font-size:17px}.muted,small{color:#a3adbf}.muted{font-size:13px}.card{background:#191f2b;border:1px solid #323c4c;border-radius:15px;padding:15px;margin:12px 0}.btn{border:0;background:#87f3a0;color:#07120a;border-radius:10px;font-weight:750;padding:13px 15px;cursor:pointer;min-height:44px}.btn.secondary{background:#323c4c;color:#f2f5fa}.btn.danger{background:#4a2830;color:#ffb7bd}.full{width:100%;margin-top:10px}input,select{background:#121722;border:1px solid #424c5d;color:white;border-radius:9px;padding:10px;min-width:0;font:inherit}input[type=number]{width:100%}input[type=checkbox]{accent-color:#87f3a0;width:20px;height:20px}label{display:block;margin:12px 0 5px;color:#a3adbf;font-size:13px}.exercise{border-bottom:1px solid #323c4c;padding:12px 0}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.row .grow{flex:1}.set-grid{display:grid;grid-template-columns:25px minmax(65px,1.4fr) repeat(3,minmax(40px,1fr)) 32px;gap:5px;align-items:center;margin:8px 0}.set-grid input{padding:7px 3px;text-align:center;font-size:14px}.set-grid small{font-size:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#191f2b;border-top:1px solid #323c4c;display:flex;padding:12px 3px calc(12px + env(safe-area-inset-bottom));z-index:3}.nav button{flex:1;background:none;color:#a3adbf;border:0;font-size:12px;padding:8px 2px}.nav button.active{color:#87f3a0;font-weight:800}.pill{font-size:12px;background:#323c4c;border-radius:99px;padding:5px 9px;display:inline-block}.metric{font-size:42px;font-weight:800;color:#87f3a0}.hidden{display:none}.toast{position:fixed;top:10px;left:10px;right:10px;background:#28384a;padding:12px;border-radius:10px;z-index:5;text-align:center}button:disabled{opacity:.45}@media(max-width:380px){main{padding-left:10px;padding-right:10px}.set-grid{gap:3px}.set-grid input{font-size:12px}}
</style></head><body><div id="toast" class="toast hidden"></div><main id="app"></main><nav id="nav" class="nav"></nav><script src="app.js"></script></body></html>
